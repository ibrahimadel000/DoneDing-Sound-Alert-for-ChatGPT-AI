<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">DoneDing — Let AI work. Stay in flow.</title>
  <desc id="desc">A dark, polished promotional banner showing the DoneDing extension dashboard with active AI sessions and completion alerts.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#242422" stroke-width="1" opacity=".7"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#131415"/>
      <stop offset=".58" stop-color="#191918"/>
      <stop offset="1" stop-color="#171716"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx=".76" cy=".45" r=".58">
      <stop offset="0" stop-color="#d65a2d" stop-opacity=".16"/>
      <stop offset="1" stop-color="#d65a2d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e65b2d"/>
      <stop offset="1" stop-color="#f49b49"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset dy="8" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".48"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="560" fill="url(#bg)"/>
  <rect width="1400" height="560" fill="url(#warmGlow)"/>
  <rect width="1400" height="560" fill="url(#grid)"/>

  <!-- Brand lockup -->
  <g transform="translate(74 53)">
    <rect width="46" height="46" rx="12" fill="#1d1d1b" stroke="#48453f"/>
    <path d="M13 28a10 10 0 0 1 20 0M17 28a6 6 0 0 1 12 0M21 28a2 2 0 0 1 4 0" fill="none" stroke="#f1eee8" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="34" cy="11" r="5.5" fill="#e65b2d"/>
  </g>
  <text x="134" y="82" fill="#f6f3ed" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">DoneDing</text>
  <text x="135" y="108" fill="#bcb6ac" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">AI COMPLETION ALERTS</text>

  <!-- Main headline -->
  <text x="74" y="224" fill="#f7f4ee" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.8">Let AI work.</text>
  <text x="74" y="293" fill="#f7f4ee" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" letter-spacing="-1.8">Stay in flow.</text>
  <text x="76" y="349" fill="#d1ccc3" font-family="Arial, Helvetica, sans-serif" font-size="20">Get an alert when a supported AI chat finishes—</text>
  <text x="76" y="381" fill="#d1ccc3" font-family="Arial, Helvetica, sans-serif" font-size="20">while you keep working in another tab.</text>

  <!-- Platform badge -->
  <rect x="76" y="420" width="246" height="40" rx="20" fill="#2c2721" stroke="#715034"/>
  <circle cx="96" cy="440" r="4" fill="#f0a956"/>
  <text x="110" y="445" fill="#f3b872" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing=".45">27 SUPPORTED AI PLATFORMS</text>
  <path d="M76 504h34" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="76" y="529" fill="#c5bfb4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Sound  ·  Browser banner  ·  Desktop alert</text>

  <!-- Extension dashboard panel -->
  <g filter="url(#shadow)">
    <rect x="780" y="8" width="600" height="544" rx="19" fill="#171716" stroke="#57544e" stroke-width="2"/>
  </g>
  <!-- Panel header -->
  <g transform="translate(800 22)">
    <rect width="28" height="28" rx="8" fill="#20201e" stroke="#4d4942"/>
    <path d="M7 18a7 7 0 0 1 14 0M10 18a4 4 0 0 1 8 0" fill="none" stroke="#eeeae3" stroke-width="1.7" stroke-linecap="round"/>
    <circle cx="22" cy="7" r="3.6" fill="#e65b2d"/>
  </g>
  <text x="838" y="43" fill="#f3f0ea" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">DoneDing</text>
  <text x="1249" y="41" fill="#c3bdb3" font-family="Arial, Helvetica, sans-serif" font-size="12">3 open</text>
  <rect x="1318" y="25" width="38" height="20" rx="10" fill="#e65b2d"/>
  <circle cx="1345" cy="35" r="7" fill="#fff"/>

  <!-- Completion card -->
  <rect x="800" y="61" width="560" height="51" rx="9" fill="#28231f" stroke="#674b39"/>
  <path d="M801 71v31" stroke="#e65b2d" stroke-width="4"/>
  <text x="815" y="82" fill="#f3f0ea" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Claude finished</text>
  <g transform="translate(816 96)" fill="none" stroke="#e65b2d" stroke-width="2" stroke-linecap="round">
    <path d="M0 4v3M5 1v9M10 0v11M15 3v5M20 1v9"/>
  </g>
  <text x="843" y="101" fill="#e97843" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Crystal Triad</text>
  <rect x="1290" y="73" width="48" height="20" rx="10" fill="#233529"/>
  <text x="1302" y="87" fill="#80d598" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">LIVE</text>

  <!-- Segmented navigation -->
  <rect x="800" y="122" width="560" height="38" rx="9" fill="#252523"/>
  <rect x="803" y="125" width="286" height="32" rx="7" fill="#3b3631"/>
  <text x="818" y="146" fill="#f4f1eb" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Open Sessions</text>
  <text x="1106" y="146" fill="#bcb6ac" font-family="Arial, Helvetica, sans-serif" font-size="13">Trigger Settings</text>

  <!-- Active AI tabs -->
  <text x="803" y="188" fill="#f3f0ea" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Active AI tabs</text>
  <text x="1293" y="187" fill="#bcb6ac" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing=".5">SCAN</text>
  <path d="M800 200h560" stroke="#403e39"/>

  <!-- Session row 1 -->
  <rect x="805" y="214" width="14" height="14" rx="3" fill="#292d29" stroke="#827c70"/>
  <path d="m808 221 3 3 5-7" fill="none" stroke="#55c877" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="831" cy="222" r="4.2" fill="#e65b2d"/>
  <text x="845" y="220" fill="#f4f1eb" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">ChatGPT</text>
  <text x="845" y="238" fill="#bcb6ac" font-family="Arial, Helvetica, sans-serif" font-size="11">Summarize the quarterly report</text>
  <rect x="1182" y="212" width="49" height="19" rx="9.5" fill="#213529"/>
  <text x="1191" y="225" fill="#56cf7a" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700">READY</text>
  <rect x="1250" y="210" width="110" height="28" rx="7" fill="#2a2926" stroke="#5b5851"/>
  <text x="1262" y="228" fill="#f1eee8" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">♪  Pro Chime</text>
  <path d="M800 261h560" stroke="#393834"/>

  <!-- Session row 2 -->
  <rect x="805" y="275" width="14" height="14" rx="3" fill="#292d29" stroke="#827c70"/>
  <path d="m808 282 3 3 5-7" fill="none" stroke="#55c877" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="831" cy="283" r="4.2" fill="#6a9aca"/>
  <text x="845" y="281" fill="#f4f1eb" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Claude</text>
  <text x="845" y="299" fill="#bcb6ac" font-family="Arial, Helvetica, sans-serif" font-size="11">Draft the project outline</text>
  <rect x="1182" y="273" width="34" height="19" rx="9.5" fill="#392f1e"/>
  <text x="1191" y="286" fill="#e9af4d" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700">12s</text>
  <rect x="1250" y="271" width="110" height="28" rx="7" fill="#2a2926" stroke="#5b5851"/>
  <text x="1262" y="289" fill="#f1eee8" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">♪  Crystal Triad</text>
  <path d="M800 322h560" stroke="#393834"/>

  <!-- Session row 3 -->
  <rect x="805" y="336" width="14" height="14" rx="3" fill="#292d29" stroke="#827c70"/>
  <path d="m808 343 3 3 5-7" fill="none" stroke="#55c877" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="831" cy="344" r="4.2" fill="#e7aa19"/>
  <text x="845" y="342" fill="#f4f1eb" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Gemini</text>
  <text x="845" y="360" fill="#bcb6ac" font-family="Arial, Helvetica, sans-serif" font-size="11">Compare these options</text>
  <rect x="1182" y="334" width="49" height="19" rx="9.5" fill="#213529"/>
  <text x="1191" y="347" fill="#56cf7a" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700">READY</text>
  <rect x="1250" y="332" width="110" height="28" rx="7" fill="#2a2926" stroke="#5b5851"/>
  <text x="1262" y="350" fill="#f1eee8" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700">♪  Warm Marimba</text>

  <!-- Output gain -->
  <rect x="800" y="421" width="560" height="38" rx="8" fill="#242422" stroke="#46443f"/>
  <text x="811" y="445" fill="#f1eee8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">Output gain</text>
  <rect x="885" y="436" width="414" height="4" rx="2" fill="#5b5851"/>
  <rect x="885" y="436" width="154" height="4" rx="2" fill="#e65b2d"/>
  <text x="1317" y="445" fill="#e97843" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">85%</text>

  <!-- Recent completions -->
  <text x="803" y="481" fill="#f3f0ea" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Recent completions</text>
  <text x="805" y="505" fill="#c4beb4" font-family="Arial, Helvetica, sans-serif" font-size="11">ChatGPT  ·  Pro Chime</text>
  <text x="1320" y="505" fill="#56cf7a" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">2.4s</text>
  <text x="805" y="527" fill="#c4beb4" font-family="Arial, Helvetica, sans-serif" font-size="11">Claude  ·  Crystal Triad</text>
  <text x="1320" y="527" fill="#56cf7a" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">5.1s</text>
</svg>
