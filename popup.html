<!DOCTYPE html>
<html lang="en" data-theme="carbon">
<head>
  <meta charset="utf-8">
  <title>DoneDing — AI Completion Monitor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="shell">
    <!-- Top Instrument Bar -->
    <header class="topbar">
      <div class="brand-lockup">
        <span class="status-led" id="headerStatusLed" title="Monitor Active"></span>
        <h1 class="brand-title">DoneDing</h1>
        <span class="inline-telemetry" id="headerTelemetry">0 open</span>
      </div>

      <div class="topbar-controls">
        <button id="themeToggleBtn" class="icon-control" title="Switch Theme (Studio Carbon / Warm Paper)" aria-label="Switch Theme">
          <svg class="svg-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="8" r="3.2"></circle>
            <path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M12.6 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3"></path>
          </svg>
        </button>

        <label class="rocker" title="Master Monitor Switch">
          <input type="checkbox" id="enabledToggle" checked>
          <span class="rocker-track">
            <span class="rocker-thumb"></span>
          </span>
        </label>
      </div>
    </header>

    <!-- Redesigned Top-Bar Notification Pill inside Extension -->
    <section class="top-alert-wrap">
      <div class="top-alert-card" id="topNotifBar" aria-live="polite">
        <span class="top-alert-accent" id="topNotifAccent" style="background-color: #D97757"></span>
        <div class="top-alert-body">
          <div class="top-alert-headline">
            <span class="top-alert-site" id="topNotifSite">Waiting for AI completion</span>
            <span class="top-alert-time" id="topNotifTime">Live</span>
          </div>
          <div class="top-alert-subline">
            <svg class="svg-wave" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M2.5 8v2M5.5 5v6M8.5 3v10M11.5 6v4M14 7v2"></path>
            </svg>
            <span class="top-alert-sound" id="topNotifSound">Pro Chime</span>
          </div>
        </div>
        <button id="topNotifReplayBtn" class="top-alert-replay" title="Replay completion sound">
          <svg class="svg-icon-sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="3 5.5 6.5 5.5 10.5 2.5 10.5 13.5 6.5 10.5 3 10.5"></polygon>
            <path d="M13 5.5a3.5 3.5 0 0 1 0 5"></path>
          </svg>
          <span>Replay</span>
        </button>
      </div>
    </section>

    <!-- 2-Tab Segmented Navigation Bar -->
    <nav class="seg-nav" role="tablist" aria-label="Views">
      <button class="seg-btn active" data-tab="view-sessions" role="tab" aria-selected="true">
        <span>Open Sessions</span>
        <span class="seg-count" id="navSessionsCount">0</span>
      </button>
      <button class="seg-btn" data-tab="view-alerts" role="tab" aria-selected="false">
        <span>Trigger Settings</span>
      </button>
    </nav>

    <!-- VIEW 1: Open Sessions + Per-Session Sound Selector + Output Gain -->
    <main class="view active" id="view-sessions" role="tabpanel">
      <div class="section-bar">
        <h2 class="section-heading">Active AI tabs (uncheck to silence, pick sound per tab)</h2>
        <button id="refreshTabsBtn" class="ghost-action" title="Rescan Chrome tabs">
          <svg class="svg-icon-sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.4-3.7"></path>
            <path d="M13.5 2.5v2.8h-2.8"></path>
          </svg>
          <span>Scan</span>
        </button>
      </div>

      <div id="multiTabList" class="session-table" role="list">
        <!-- Populated dynamically with open AI tabs across all windows -->
      </div>

      <!-- Output Gain moved directly into Open Sessions -->
      <div class="fader-block">
        <div class="fader-header">
          <label for="volumeSlider" class="fader-label">Output gain (Master volume)</label>
          <output id="volumeLabel" class="fader-readout">85%</output>
        </div>
        <input type="range" id="volumeSlider" min="5" max="100" value="85" class="fader-input">
      </div>

      <div class="section-bar section-bar-spaced">
        <h2 class="section-heading">Recent completions</h2>
        <button id="clearHistoryBtn" class="ghost-action">Clear</button>
      </div>

      <div id="recentHistoryList" class="log-table" role="list">
        <!-- Populated dynamically with recent completed responses -->
      </div>
    </main>

    <!-- VIEW 2: Trigger Conditions & Computer System Notification -->
    <main class="view" id="view-alerts" role="tabpanel">
      <div class="section-bar">
        <h2 class="section-heading">Trigger conditions</h2>
        <button id="testSystemNotifBtn" class="primary-action" title="Send a real test notification to your computer system">
          <svg class="svg-icon-sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="12" height="9" rx="1.5"></rect>
            <path d="M5.5 14h5"></path>
          </svg>
          <span id="testOsBtnLabel">Test Computer Alert</span>
        </button>
      </div>

      <div class="rule-stack">
        <label class="rule-row">
          <div class="rule-copy">
            <span class="rule-title">Computer system notification (OS Banner)</span>
            <span class="rule-desc">Shows a native Windows / macOS notification banner on your laptop when any checked AI chat finishes</span>
          </div>
          <input type="checkbox" id="desktopNotificationToggle" class="rule-check" checked>
        </label>

        <label class="rule-row">
          <div class="rule-copy">
            <span class="rule-title">Top-bar notification banner</span>
            <span class="rule-desc">Slides down a completion pill at the top of the page with the AI site name and sound played</span>
          </div>
          <input type="checkbox" id="inPageTopBannerToggle" class="rule-check" checked>
        </label>

        <label class="rule-row">
          <div class="rule-copy">
            <span class="rule-title">Play completion sound</span>
            <span class="rule-desc">Plays the sound assigned to each AI tab in Open Sessions</span>
          </div>
          <input type="checkbox" id="soundEnabledToggle" class="rule-check" checked>
        </label>

        <label class="rule-row">
          <div class="rule-copy">
            <span class="rule-title">Background tabs only</span>
            <span class="rule-desc">Only trigger sound and notifications when you are in another tab or app</span>
          </div>
          <input type="checkbox" id="onlyWhenUnfocusedToggle" class="rule-check">
        </label>
      </div>
    </main>

    <!-- Bottom Status Strip -->
    <footer class="bottombar">
      <span id="footerStatusText">DoneDing active across 27 AI sites</span>
      <span class="tabular-metric" id="footerCompletionsCount">0 completed</span>
    </footer>
  </div>

  <script src="sound_engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
