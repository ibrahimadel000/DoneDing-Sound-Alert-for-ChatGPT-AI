<!DOCTYPE html>
<html lang="en" data-theme="carbon">
<head>
  <meta charset="utf-8">
  <title>DoneDing — AI Completion Monitor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="shell">
    <!-- Top Instrument Bar -->
    <header class="topbar">
      <div class="brand-lockup">
        <span class="status-led" id="headerStatusLed" title="Monitor Active"></span>
        <h1 class="brand-title">DoneDing</h1>
        <span class="inline-telemetry" id="headerTelemetry">0 open</span>
      </div>

      <div class="topbar-controls">
        <button id="themeToggleBtn" class="icon-control" title="Switch Theme (Studio Carbon / Warm Paper)" aria-label="Switch Theme">
          <svg class="svg-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="8" r="3.2"></circle>
            <path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M12.6 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3"></path>
          </svg>
        </button>

        <label class="rocker" title="Master Monitor Switch">
          <input type="checkbox" id="enabledToggle" checked>
          <span class="rocker-track">
            <span class="rocker-thumb"></span>
          </span>
        </label>
      </div>
    </header>

    <!-- Live Top-Bar Notification Strip (Shows AI Site + Sound Played) -->
    <aside class="top-notif-bar" id="topNotifBar" aria-live="polite">
      <div class="top-notif-main">
        <span class="host-marker" id="topNotifDot" style="background-color: #D97757"></span>
        <div class="top-notif-copy">
          <span class="top-notif-site" id="topNotifSite">No recent alert</span>
          <span class="top-notif-sound" id="topNotifSound">Sound: Pro Chime</span>
        </div>
      </div>
      <div class="top-notif-actions">
        <button id="topNotifReplayBtn" class="mini-btn" title="Replay site sound">
          <svg class="svg-icon-sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="3 5.5 6.5 5.5 10.5 2.5 10.5 13.5 6.5 10.5 3 10.5"></polygon>
            <path d="M13 5.5a3.5 3.5 0 0 1 0 5"></path>
          </svg>
          <span>Sound</span>
        </button>
      </div>
    </aside>

    <!-- Streamlined 2-Tab Segmented Navigation (Sessions & Acoustics) -->
    <nav class="seg-nav" role="tablist" aria-label="Views">
      <button class="seg-btn active" data-tab="view-sessions" role="tab" aria-selected="true">
        <span>Open Sessions</span>
        <span class="seg-count" id="navSessionsCount">0</span>
      </button>
      <button class="seg-btn" data-tab="view-sound" role="tab" aria-selected="false">
        <span>Acoustics &amp; Alerts</span>
      </button>
    </nav>

    <!-- VIEW 1: Live Multi-Tab Sessions (with Per-Tab Check/Uncheck & Per-Site Sound Assignment) -->
    <main class="view active" id="view-sessions" role="tabpanel">
      <div class="section-bar">
        <h2 class="section-heading">Open AI tabs (uncheck any site to mute)</h2>
        <button id="refreshTabsBtn" class="ghost-action" title="Rescan Chrome tabs">
          <svg class="svg-icon-sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.4-3.7"></path>
            <path d="M13.5 2.5v2.8h-2.8"></path>
          </svg>
          <span>Scan</span>
        </button>
      </div>

      <div id="multiTabList" class="session-table" role="list">
        <!-- Populated dynamically with open AI tabs across all windows -->
      </div>

      <div class="section-bar section-bar-spaced">
        <h2 class="section-heading">Recent completions</h2>
        <button id="clearHistoryBtn" class="ghost-action">Clear</button>
      </div>

      <div id="recentHistoryList" class="log-table" role="list">
        <!-- Populated dynamically with recent completed responses -->
      </div>
    </main>

    <!-- VIEW 2: Acoustic Studio & Computer System Notifications -->
    <main class="view" id="view-sound" role="tabpanel">
      <div class="section-bar">
        <h2 class="section-heading">Default acoustic signature</h2>
        <button id="testSoundBtn" class="primary-action" title="Audition selected tone">
          <svg class="svg-icon-sm" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="3 5.5 6.5 5.5 10.5 2.5 10.5 13.5 6.5 10.5 3 10.5"></polygon>
            <path d="M13 5.5a3.5 3.5 0 0 1 0 5"></path>
          </svg>
          <span>Audition</span>
        </button>
      </div>

      <div class="tone-list" id="presetGrid" role="radiogroup" aria-label="Chime Tone">
        <button class="tone-row active" data-preset="pro_chime" role="radio" aria-checked="true">
          <span class="tone-radio"></span>
          <span class="tone-name">Pro Chime</span>
          <span class="tone-spec">F#5 → B5 · Default for Gemini</span>
        </button>
        <button class="tone-row" data-preset="warm_marimba" role="radio" aria-checked="false">
          <span class="tone-radio"></span>
          <span class="tone-name">Warm Marimba</span>
          <span class="tone-spec">G4 → D5 → B5 · Default for Claude</span>
        </button>
        <button class="tone-row" data-preset="crystal_triad" role="radio" aria-checked="false">
          <span class="tone-radio"></span>
          <span class="tone-name">Crystal Triad</span>
          <span class="tone-spec">D5 → F#5 → D6 · Default for ChatGPT</span>
        </button>
        <button class="tone-row" data-preset="double_pulse" role="radio" aria-checked="false">
          <span class="tone-radio"></span>
          <span class="tone-name">Studio Pulse</span>
          <span class="tone-spec">A5 → D6 · Default for DeepSeek &amp; Grok</span>
        </button>
        <button class="tone-row" data-preset="soft_harp" role="radio" aria-checked="false">
          <span class="tone-radio"></span>
          <span class="tone-name">Celestial Harp</span>
          <span class="tone-spec">C5 → C6 · Default for Notion &amp; Kimi</span>
        </button>
        <button class="tone-row" data-preset="gentle_zen" role="radio" aria-checked="false">
          <span class="tone-radio"></span>
          <span class="tone-name">Resonant Bowl</span>
          <span class="tone-spec">528 Hz · Default for Perplexity</span>
        </button>
      </div>

      <div class="fader-block">
        <div class="fader-header">
          <label for="volumeSlider" class="fader-label">Output gain</label>
          <output id="volumeLabel" class="fader-readout">85%</output>
        </div>
        <input type="range" id="volumeSlider" min="5" max="100" value="85" class="fader-input">
      </div>

      <div class="section-bar section-bar-spaced">
        <h2 class="section-heading">Trigger conditions</h2>
        <button id="testSystemNotifBtn" class="ghost-action" title="Send a test notification to your computer system">
          <span>Test OS Alert</span>
        </button>
      </div>

      <div class="rule-stack">
        <label class="rule-row">
          <div class="rule-copy">
            <span class="rule-title">Distinct sound for each AI website</span>
            <span class="rule-desc">Assigns a unique chime to Gemini, Claude, ChatGPT, DeepSeek &amp; others</span>
          </div>
          <input type="checkbox" id="distinctSiteSoundsToggle" class="rule-check" checked>
        </label>

        <label class="rule-row">
          <div class="rule-copy">
            <span class="rule-title">Computer system notification (OS Banner)</span>
            <span class="rule-desc">Shows native Windows / macOS notification on your laptop when finished</span>
          </div>
          <input type="checkbox" id="desktopNotificationToggle" class="rule-check" checked>
        </label>

        <label class="rule-row">
          <div class="rule-copy">
            <span class="rule-title">Top-bar notification banner</span>
            <span class="rule-desc">Displays completion bar with site name and sound tone at the top</span>
          </div>
          <input type="checkbox" id="inPageTopBannerToggle" class="rule-check" checked>
        </label>

        <label class="rule-row">
          <div class="rule-copy">
            <span class="rule-title">Background tabs only</span>
            <span class="rule-desc">Silence alerts when you are already viewing that AI chat tab</span>
          </div>
          <input type="checkbox" id="onlyWhenUnfocusedToggle" class="rule-check">
        </label>
      </div>
    </main>

    <!-- Bottom Status Strip -->
    <footer class="bottombar">
      <span id="footerStatusText">DoneDing active across 27 AI sites</span>
      <span class="tabular-metric" id="footerCompletionsCount">0 completed</span>
    </footer>
  </div>

  <script src="sound_engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
